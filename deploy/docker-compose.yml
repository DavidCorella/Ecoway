name: ecoway

x-conn: &conn
  ConnectionStrings__DefaultConnection: Server=db;Database=app;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True

services:
  web:
    image: ghcr.io/davidcorella/ecoway-web:${IMAGE_TAG:-prod}
    restart: unless-stopped
    networks: [interna]

  api:
    image: ghcr.io/davidcorella/ecoway-api:${IMAGE_TAG:-prod}
    restart: unless-stopped
    environment:
      <<: *conn
      Bccr__Token: ${BCCR_TOKEN}
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
      - uploads:/app/App_Data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  migrator:
    image: ghcr.io/davidcorella/ecoway-migrator:${IMAGE_TAG:-prod}
    environment:
      <<: *conn
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    profiles: ["tools"]

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
      - /mnt/backup/sql:/backup
    # La contraseña va por SQLCMDPASSWORD ($$ = la expande el contenedor, no compose):
    # no aparece en `docker inspect` ni en la lista de procesos.
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
      start_interval: 5s
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
    networks: [interna]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [interna]

volumes:
  db-data:
    external: true
    name: miapp_db-data
  dpkeys:
    external: true
    name: miapp_dpkeys
  uploads:
    external: true
    name: miapp_uploads

networks:
  interna: