name: ecoway

x-conn: &conn
  ConnectionStrings__DefaultConnection: Server=db;Database=app;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True

services:
  web:
    image: ghcr.io/davidcorella/ecoway-web:${IMAGE_TAG:-prod}
    restart: unless-stopped
    networks: [interna]

  api:
    image: ghcr.io/davidcorella/ecoway-api:${IMAGE_TAG:-prod}
    restart: unless-stopped
    environment:
      <<: *conn
      Bccr__Token: ${BCCR_TOKEN}
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
      - uploads:/app/App_Data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  migrator:
    image: ghcr.io/davidcorella/ecoway-migrator:${IMAGE_TAG:-prod}
    environment:
      <<: *conn
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    profiles: ["tools"]

  db:
    # Versión fija: con 2022-latest un deploy podía actualizar SQL Server sin aviso.
    # Para actualizar, cambiá la CU acá (y hacé el deploy en horario tranquilo).
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
      - /mnt/backup/sql:/backup
    # La contraseña va por SQLCMDPASSWORD ($$ = la expande el contenedor, no compose):
    # no aparece en `docker inspect` ni en la lista de procesos.
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Margen amplio: al cambiar de versión, SQL Server pasa minutos en "script upgrade mode".
      start_period: 600s
      start_interval: 5s
    networks: [interna]

  # PostgreSQL 18 (migración desde SQL Server, fase 2).
  # Por ahora corre EN PARALELO: la api sigue usando `db` hasta el corte.
  pg:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Falta PG_ADMIN_PASSWORD en .env}
      # Contraseña del usuario de la app (ecoway): la usa deploy.sh para crearlo, no postgres.
      PG_APP_PASSWORD: ${PG_PASSWORD:?Falta PG_PASSWORD en .env}
    # Servidor de 7 GB compartido con SQL Server (mientras dure el paralelo) y otros stacks.
    command: >-
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=50
    volumes:
      - pg-data:/var/lib/postgresql
      - /mnt/backup/sql:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
    networks: [interna]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [interna]

volumes:
  db-data:
    external: true
    name: miapp_db-data
  dpkeys:
    external: true
    name: miapp_dpkeys
  uploads:
    external: true
    name: miapp_uploads
  # Externo: no se borra con `docker compose down -v`. Crearlo una vez: docker volume create ecoway_pg-data
  pg-data:
    external: true
    name: ecoway_pg-data

networks:
  interna: