name: ecoway

x-conn: &conn
  ConnectionStrings__DefaultConnection: Host=pg;Port=5432;Database=app;Username=ecoway;Password=${PG_PASSWORD:?Falta PG_PASSWORD en .env}

services:
  web:
    image: ghcr.io/davidcorella/ecoway-web:${IMAGE_TAG:-prod}
    restart: unless-stopped
    networks: [interna]

  api:
    image: ghcr.io/davidcorella/ecoway-api:${IMAGE_TAG:-prod}
    restart: unless-stopped
    environment:
      <<: *conn
      Bccr__Token: ${BCCR_TOKEN}
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
      - uploads:/app/App_Data/uploads
    depends_on:
      pg:
        condition: service_healthy
    networks: [interna]

  migrator:
    image: ghcr.io/davidcorella/ecoway-migrator:${IMAGE_TAG:-prod}
    environment:
      <<: *conn
    depends_on:
      pg:
        condition: service_healthy
    networks: [interna]
    profiles: ["tools"]

  # SQL Server: YA NO lo usa la app (desde el corte a PostgreSQL). Queda definido, con su
  # volumen intacto, por si hay que volver atrás. El perfil hace que los deploys no lo
  # levanten. Para arrancarlo a mano: docker compose --profile sqlserver up -d db
  # Borrarlo (y el volumen miapp_db-data) solo cuando el corte esté confirmado.
  db:
    profiles: ["sqlserver"]
    # Versión fija: con 2022-latest un deploy podía actualizar SQL Server sin aviso.
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
      - /mnt/backup/sql:/backup
    # La contraseña va por SQLCMDPASSWORD ($$ = la expande el contenedor, no compose):
    # no aparece en `docker inspect` ni en la lista de procesos.
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Margen amplio: al cambiar de versión, SQL Server pasa minutos en "script upgrade mode".
      start_period: 600s
      start_interval: 5s
    networks: [interna]

  # PostgreSQL 18: base de datos de la app (BD `app`, usuario `ecoway`).
  pg:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Falta PG_ADMIN_PASSWORD en .env}
      # Contraseña del usuario de la app (ecoway): la usa deploy.sh para crearlo, no postgres.
      PG_APP_PASSWORD: ${PG_PASSWORD:?Falta PG_PASSWORD en .env}
    # Servidor de 7 GB compartido con otros stacks.
    # Archivado de WAL (equivale al BACKUP LOG cada 2 min de SQL Server): cada segmento se
    # copia comprimido a /wal (= /mnt/backup/pgwal). archive_timeout fuerza uno cada 2 min
    # si hubo cambios, así se pierden como mucho ~2 min. Lo sube a Drive backup-pgwal.sh.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - wal_compression=on
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=120
      - -c
      - archive_command=test ! -f /wal/%f.gz && gzip -1 < %p > /wal/%f.gz.tmp && mv /wal/%f.gz.tmp /wal/%f.gz
    volumes:
      - pg-data:/var/lib/postgresql
      - /mnt/backup/sql:/backup
      # Crear una vez en el host: sudo install -d -o 999 -g 999 -m 700 /mnt/backup/pgwal
      - /mnt/backup/pgwal:/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
    networks: [interna]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [interna]

volumes:
  db-data:
    external: true
    name: miapp_db-data
  dpkeys:
    external: true
    name: miapp_dpkeys
  uploads:
    external: true
    name: miapp_uploads
  # Externo: no se borra con `docker compose down -v`. Crearlo una vez: docker volume create ecoway_pg-data
  pg-data:
    external: true
    name: ecoway_pg-data

networks:
  interna: